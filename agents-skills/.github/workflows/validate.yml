name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate every skill
        run: python3 skills/agent-skill-authoring/scripts/validate_skill.py skills/ --strict

      - name: Check scaffolding still works
        run: |
          python3 skills/agent-skill-authoring/scripts/new_skill.py ci-smoke-test --dir /tmp/skills
          python3 skills/agent-skill-authoring/scripts/validate_skill.py /tmp/skills/ci-smoke-test
